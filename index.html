<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Hà Linh</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sao"></div>

    <div class="lantern-container">
        <div class="lantern" style="left: 10%; animation-duration: 12s; animation-delay: 0s;"></div>
        <div class="lantern" style="left: 80%; animation-duration: 15s; animation-delay: 2s;"></div>
        <div class="lantern" style="left: 40%; animation-duration: 18s; animation-delay: 5s;"></div>
        <div class="lantern" style="left: 65%; animation-duration: 14s; animation-delay: 8s;"></div>
    </div>
    <div class="sao"></div>
    <div class="sao" style="top: 20%; left: 80%; animation-delay: 2s;"></div>

    <img src="https://i.imgur.com/your-cloud.png" alt="Cloud" class="cloud cloud-left">
    <img src="https://i.imgur.com/your-cloud.png" alt="Cloud" class="cloud cloud-right">

    <!-- ❌ ĐÃ XÓA PHẦN MUSIC PLAYER -->

    <main class="letter-wrapper">
        <div class="letter-paper">
            <div class="decor-top">
                <div class="moon-glow"></div>
                <!-- 
                    ✅ THAY LINK ẢNH THỎ CỦA BẠN VÀO ĐÂY
                    Ví dụ:
                    <img src="img/rabbit.png" alt="Rabbit" class="rabbit-img">
                    hoặc link online:
                    <img src="https://link-anh-tho-cua-ban.png" alt="Rabbit" class="rabbit-img">
                -->
                <img src="img/rabbit.png" alt="Rabbit" class="rabbit-img">
            </div>
            
            <div class="letter-content">
                <h1 class="title">Gửi Linhh,</h1>
                <p id="typewriter-text" class="typewriter"></p>
                <div class="signature">FROM DPHONG ❤️</div>
            </div>
        </div>
    </main>

  

    <script src="script.js"></script>
    <div id="vung"></div>
</body>
</html>
